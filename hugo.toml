baseURL = "https://hill68.github.io/"
languageCode = "zh-cn"
title = "FlitSoft Docs"
theme = "hugo-theme-relearn"

# 指定 Hugo build 输出到 docs/ 目录
publishDir = "docs"
disableKinds = ["taxonomy"] # 关闭 /tags/ 和 /categories/ 等分类页面

# --- Google Analytics 核心配置 ---

# 1. 启用 GA 服务并提供 ID
[services]
  [services.googleAnalytics]
    ID = "G-TXZZJN3Q2Y"

# 2. 确保隐私设置允许 GA 运行
[privacy]
  [privacy.googleAnalytics]
    disable = false
    respectDoNotTrack = false # 如果设为true，当用户浏览器开启“Do Not Track”时，GA脚本不会加载


# ===================================================
# 正确的写法（请直接复制此版本）
# ===================================================

# Relearn 主题及其他参数
# 这是 [params] 表格，里面只应该有 key = value 格式的行
[params]
  subtitle = "副标题 / 口号"
  dateFormat = "2006-01-02"
  showReadingTime = true
  themeVariant = ['zen-light', 'zen-dark']
  highlightTheme = "dracula"
  math = true
  disableLandingPageButton = true
  disablePrintButton = false
  customCSS = ["css/custom.css"]

# 这是 [params.author] 表格，它是一个独立的块，与 [params] 平级
[params.author]
  name = "Z.Huang@FlitSoft"

# 这是 [markup] 表格，它也是一个独立的块，与上面的都平级
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许在 Markdown 中渲染原生 HTML
      unsafe = true

    # 启用 passthrough 扩展，并自定义数学分隔符
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ['\[', '\]'],
            ['$$', '$$']
          ]
          inline = [
            ['\(', '\)'],
            ['$', '$']
          ]